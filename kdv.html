<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDV Hesaplama | HesaplaBoz</title><meta name="description" content="KDV dahil ve hariç tutarı seçtiğin KDV oranıyla hızlı ve ücretsiz hesapla."><meta name="robots" content="index,follow"><link rel="canonical" href="https://hesaplaboz.vercel.app/calculators/kdv.html"><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><a class="brand" href="../index.html"><span class="brand-mark">H</span><span>Hesapla<span>Boz</span></span></a><a class="back" href="../index.html">← Tüm hesaplamalar</a></header><main class="wrap"><span class="crumb">Muhasebe</span><h1>KDV Hesaplama</h1><p>KDV dahil ve hariç tutarı, seçtiğin KDV oranına göre anında hesapla.</p><div class="calc"><div class="grid"><div><label>Tutar</label><input id="amount" type="number" value="10000" min="0"></div><div><label>KDV Oranı</label><select id="rate"><option value="0.01">%1</option><option value="0.10">%10</option><option value="0.20" selected>%20</option></select></div></div><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result"><p>KDV tutarı</p><div class="big" id="vat"></div><p>KDV dahil toplam</p><div class="big" id="total"></div></div><div class="note">Tutarın KDV hariç olduğu varsayılmıştır. Ticari işlemlerde uygulanacak KDV oranını işlem türüne göre ayrıca kontrol et.</div></div></main><script>function tl(n){return n.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}function calc(){const a=+document.getElementById('amount').value||0,r=+document.getElementById('rate').value;document.getElementById('vat').textContent=tl(a*r);document.getElementById('total').textContent=tl(a*(1+r));document.getElementById('result').style.display='block'}calc()</script></body></html>
