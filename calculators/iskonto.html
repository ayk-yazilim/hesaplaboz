<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İskonto Hesaplama | HesaplaBoz</title><meta name="description" content="Liste fiyatı ve iskonto oranını girerek indirim tutarını ve indirimli fiyatı hesapla."><meta name="robots" content="index,follow"><link rel="canonical" href="https://hesaplaboz.vercel.app/calculators/iskonto.html"><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="../index.html"><span class="brand-mark">H</span><span>Hesapla<span>Boz</span></span></a><a class="back" href="../index.html">← Tüm hesaplamalar</a></header><main class="wrap"><span class="crumb">Ticari</span><h1>İskonto Hesaplama</h1><p>İndirim oranını uygulayarak iskonto tutarını ve indirimli fiyatı bul.</p><div class="calc"><div class="grid"><div><label>Liste fiyatı</label><input id="price" type="number" value="10000" min="0"></div><div><label>İskonto (%)</label><input id="rate" type="number" value="10" min="0" max="100" step="0.01"></div></div><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result"><p>İskonto tutarı</p><div class="big" id="discount"></div><p>İskonto sonrası fiyat</p><div class="big" id="net"></div></div></div></main><script>function tl(n){return n.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}function calc(){let p=+price.value||0,r=(+rate.value||0)/100,d=p*r;discount.textContent=tl(d);net.textContent=tl(p-d);result.style.display='block'}calc()</script></body></html>
