<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yakıt Maliyeti Hesaplama | HesaplaBoz</title><meta name="description" content="Yakıt tüketimi, kilometre ve yakıt fiyatına göre km başına ve yıllık yakıt maliyetini hesapla."><meta name="robots" content="index,follow"><link rel="canonical" href="https://hesaplaboz.vercel.app/calculators/yakit.html"><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="../index.html"><span class="brand-mark">H</span><span>Hesapla<span>Boz</span></span></a><a class="back" href="../index.html">← Tüm hesaplamalar</a></header><main class="wrap"><span class="crumb">Araç</span><h1>Yakıt Maliyeti</h1><p>Aracının 100 km'de tüketimi ve yakıt fiyatıyla kilometre ve yıllık maliyeti hesapla.</p><div class="calc"><div class="grid"><div><label>100 km tüketim (L)</label><input id="cons" type="number" value="7.2" step="0.1" min="0"></div><div><label>Yakıt fiyatı (TL/L)</label><input id="price" type="number" value="55" step="0.1" min="0"></div></div><label>Yıllık kilometre</label><input id="km" type="number" value="15000" min="0"><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result"><p>100 km maliyeti</p><div class="big" id="per100"></div><p>Km başına maliyet</p><div class="big" id="perkm"></div><p>Yıllık yakıt maliyeti</p><div class="big" id="year"></div></div></div></main><script>function tl(n){return n.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}function calc(){let c=+cons.value||0,p=+price.value||0,k=+km.value||0,v=c*p;per100.textContent=tl(v);perkm.textContent=tl(v/100);year.textContent=tl(v*k/100);result.style.display='block'}calc()</script></body></html>
