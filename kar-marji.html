<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kâr Marjı Hesaplama | HesaplaBoz</title><meta name="description" content="Maliyet ve satış fiyatını girerek kâr tutarını ve kâr marjını hızlıca hesapla."><meta name="robots" content="index,follow"><link rel="canonical" href="https://hesaplaboz.vercel.app/calculators/kar-marji.html"><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><a class="brand" href="../index.html"><span class="brand-mark">H</span><span>Hesapla<span>Boz</span></span></a><a class="back" href="../index.html">← Tüm hesaplamalar</a></header><main class="wrap"><span class="crumb">İşletme</span><h1>Kâr Marjı Hesaplama</h1><p>Maliyet ve satış fiyatından brüt kârı ve kâr marjını hesapla.</p><div class="calc"><div class="grid"><div><label>Maliyet</label><input id="cost" type="number" value="700" min="0"></div><div><label>Satış fiyatı</label><input id="sale" type="number" value="1000" min="0"></div></div><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result"><p>Brüt kâr</p><div class="big" id="profit"></div><p>Kâr marjı</p><div class="big" id="margin"></div></div></div></main><script>function tl(n){return n.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}function calc(){let c=+cost.value||0,s=+sale.value||0,p=s-c;profit.textContent=tl(p);margin.textContent=(s?p/s*100:0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' %';result.style.display='block'}calc()</script></body></html>
