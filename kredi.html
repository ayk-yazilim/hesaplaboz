<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kredi Hesaplama | HesaplaBoz</title><meta name="description" content="Kredi tutarı, faiz ve vade bilgilerini girerek aylık taksiti ve toplam geri ödemeyi hesapla."><meta name="robots" content="index,follow"><link rel="canonical" href="https://hesaplaboz.vercel.app/calculators/kredi.html"><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><a class="brand" href="../index.html"><span class="brand-mark">H</span><span>Hesapla<span>Boz</span></span></a><a class="back" href="../index.html">← Tüm hesaplamalar</a></header><main class="wrap"><span class="crumb">Finans</span><h1>Kredi Hesaplama</h1><p>Kredi tutarı, vade ve aylık faiz oranıyla yaklaşık aylık taksitini hesapla.</p><div class="calc"><div class="grid"><div><label>Kredi Tutarı</label><input id="p" type="number" value="100000" min="0"></div><div><label>Vade (ay)</label><input id="n" type="number" value="12" min="1"></div></div><label>Aylık faiz oranı (%)</label><input id="r" type="number" value="3" min="0" step="0.01"><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result"><p>Aylık taksit</p><div class="big" id="pay"></div><p>Toplam geri ödeme</p><div class="big" id="total"></div></div><div class="note">Bu araç basitleştirilmiş matematiksel hesaplama yapar. Banka tahsis ücreti, sigorta, vergi ve diğer masraflar dahil değildir.</div></div></main><script>function tl(n){return n.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}function calc(){let p=+document.getElementById('p').value||0,n=+document.getElementById('n').value||1,r=(+document.getElementById('r').value||0)/100;let pay=r? p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n;document.getElementById('pay').textContent=tl(pay);document.getElementById('total').textContent=tl(pay*n);document.getElementById('result').style.display='block'}calc()</script></body></html>
